name: iOS AI billing build
on:
  pull_request:
    paths:
      - 'WeekFit/**'
      - 'WeekFit.xcodeproj/**'
      - '.github/workflows/ios-ai-billing-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-ai-billing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Check AI usage translations
        run: python3 Scripts/verify-ai-usage-localizations.py
      - name: Build simulator app without signing
        run: >-
          xcodebuild -project WeekFit.xcodeproj -scheme WeekFit
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/weekfit-derived ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
