name: Food photo container check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - backend/food-photo-recognize/**
      - .github/workflows/food-photo-container-check.yml
  push:
    branches: [coach-openai-single-attempt]
    paths:
      - backend/food-photo-recognize/**
      - .github/workflows/food-photo-container-check.yml
permissions:
  contents: read
concurrency:
  group: food-photo-container-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  container:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build --tag weekfit-food-photo:ci backend/food-photo-recognize
      - name: Run mock food and Coach checks
        run: bash backend/food-photo-recognize/scripts/container-http-check.sh weekfit-food-photo:ci
      - name: Check single-node capacity with mock provider and no network
        run: docker run --rm --network none -e NODE_ENV=development --entrypoint node weekfit-food-photo:ci scripts/capacity-mock-check.mjs

